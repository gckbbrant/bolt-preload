name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check and test the library
        run: |
          moon version --all
          moon update
          moon check --target native
          moon test --target native
          moon test --target js
      - name: Test the native command line
        run: python3 tests/test_cli.py
      - name: Checkout fatigue-spectrum for the paired example
        uses: actions/checkout@v5
        with:
          repository: gckbbrant/fatigue-spectrum
          path: _build/fatigue-spectrum
      - name: Run the paired stiffness example
        run: |
          (cd _build/fatigue-spectrum && moon update)
          python3 scripts/compare_joints.py --fatigue _build/fatigue-spectrum --output _build/comparison.json
          python3 scripts/compare_joints.py --config samples/comparison-config.json --fatigue _build/fatigue-spectrum --sn _build/fatigue-spectrum/samples/sn.json --output _build/config-comparison.json
          python3 scripts/compare_joints.py --config samples/logger-comparison.json --fatigue _build/fatigue-spectrum --sn _build/fatigue-spectrum/samples/sn.json --output _build/logger-comparison.json
          python3 scripts/compare_joints.py --config samples/sensor-comparison.json --fatigue _build/fatigue-spectrum --sn _build/fatigue-spectrum/samples/sn.json --output _build/sensor-comparison.json
          FATIGUE_PROJECT=_build/fatigue-spectrum python3 tests/test_comparison.py
